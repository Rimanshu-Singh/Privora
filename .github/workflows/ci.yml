name: Privora CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smart-contract:
    name: Smart Contract CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile Compact contract
        working-directory: contracts
        run: node scripts/compile-contract.mjs

      - name: Synchronize contract artifacts
        working-directory: contracts
        run: node scripts/sync-artifacts.mjs

      - name: Run contract tests
        working-directory: contracts
        run: npm test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: smart-contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Generate frontend contract artifacts
        working-directory: contracts
        run: |
          node scripts/compile-contract.mjs
          node scripts/sync-artifacts.mjs

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run frontend lint
        working-directory: app
        run: npm run lint

      - name: Build frontend
        working-directory: app
        run: npm run build
